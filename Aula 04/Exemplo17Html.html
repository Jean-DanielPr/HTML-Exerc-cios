<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 17 - HMTL</title>
</head>
<body>
    <h1>Cadastro Pessoal</h1>
    <form action="paginaCadastro.jsp">
        <fieldset>
                <legend>Informações Pessoais</legend>
            <div>    
                <label for="">Nome Completo:</label><br>
                <input type="text" name="txtNome" id="txtNome" placeholder="Digite seu nome completo">
            </div>
            <div>
                <label for="">E-mail:</label><br>
                <input type="email" name="txtEmail" id="txtEmail" placeholder="exemplo@gmail.com">
            </div>
            <div>
                <label for="">Ano de nascimento:</label><br> 
                <input type="date" name="txtDataNascimento" id="txtDataNascimento">
            </div>
        </fieldset>
    </form>
</body>
</html>
